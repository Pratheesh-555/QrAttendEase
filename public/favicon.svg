<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)"/>
  
  <!-- QR code squares -->
  <rect x="20" y="20" width="15" height="15" fill="white" rx="2"/>
  <rect x="65" y="20" width="15" height="15" fill="white" rx="2"/>
  <rect x="20" y="65" width="15" height="15" fill="white" rx="2"/>
  
  <!-- Center pattern -->
  <rect x="42" y="42" width="16" height="16" fill="white" rx="2"/>
  <rect x="46" y="46" width="8" height="8" fill="url(#grad)" rx="1"/>
  
  <!-- Graduation cap -->
  <g transform="translate(50, 50)">
    <polygon points="-12,-5 12,-5 0,-12" fill="white"/>
    <rect x="-2" y="-5" width="4" height="8" fill="white"/>
    <circle cx="2" cy="3" r="2" fill="white"/>
  </g>
</svg>
